name: BazaarLens — Post-Deploy Test Agents

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  # Fires after Vercel (or GitHub Pages) marks a deployment as succeeded.
  # This is the right trigger — tests run on live code, not mid-deploy.
  deployment_status:

  # Also allows manual runs from the GitHub Actions UI (Actions tab → Run workflow)
  workflow_dispatch:
    inputs:
      symbols:
        description: "NSE symbols to test (comma-separated)"
        default: "RELIANCE,INFY,TCS"
        required: false

# ── Permissions ───────────────────────────────────────────────────────────────
permissions:
  contents: read
  deployments: read
  statuses: write      # needed to post commit status
  pull-requests: write # needed to comment on PRs

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:
  test-agents:
    name: Run test agents
    runs-on: ubuntu-latest

    # Only run when:
    #   1. A deployment_status event fires AND the deployment succeeded AND it's production
    #   2. OR it's a manual workflow_dispatch run
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        contains(github.event.deployment.environment, 'roduction')
      )

    steps:

      # ── 1. Checkout the repo ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Show which deployment triggered the run ──────────────────────────
      - name: Log deployment info
        run: |
          echo "Triggered by : ${{ github.event_name }}"
          echo "Environment  : ${{ github.event.deployment.environment }}"
          echo "Deploy URL   : ${{ github.event.deployment_status.target_url }}"
          echo "Commit SHA   : ${{ github.sha }}"

      # ── 3. Python setup ─────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bazaarlens-tests/requirements.txt

      # ── 4. Install Python dependencies ──────────────────────────────────────
      - name: Install Python dependencies
        working-directory: bazaarlens-tests
        run: pip install -r requirements.txt

      # ── 5. Install Playwright browser ────────────────────────────────────────
      - name: Install Playwright + Chromium
        working-directory: bazaarlens-tests
        run: playwright install chromium --with-deps

      # ── 6. Run all three test agents + developer agent ───────────────────────
      - name: Run test agents
        id: run_tests
        working-directory: bazaarlens-tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_URL: ${{ secrets.BAZAARLENS_BASE_URL }}
          API_URL: ${{ secrets.BAZAARLENS_API_URL }}
          SYMBOLS: ${{ github.event.inputs.symbols || 'RELIANCE,INFY,TCS' }}
        # Exit code 1 = critical/high issues found (set in graph.py)
        # continue-on-error so we can still upload the report + post a comment
        continue-on-error: true
        run: |
          python graph.py 2>&1 | tee /tmp/test_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # ── 7. Read report for the commit comment ────────────────────────────────
      - name: Read test summary
        id: read_summary
        if: always()
        working-directory: bazaarlens-tests
        run: |
          # Grab the latest report file
          REPORT=$(ls -t reports/report_*.md 2>/dev/null | head -1)
          ISSUES=$(ls -t reports/issues_*.json 2>/dev/null | head -1)

          if [ -f "$REPORT" ]; then
            # Extract Summary section (first 20 lines after ## Summary)
            SUMMARY=$(awk '/^## Summary/{found=1; next} found && /^##/{exit} found{print}' "$REPORT" | head -10)
            echo "summary<<EOF" >> $GITHUB_OUTPUT
            echo "$SUMMARY"    >> $GITHUB_OUTPUT
            echo "EOF"          >> $GITHUB_OUTPUT
          else
            echo "summary=No report generated." >> $GITHUB_OUTPUT
          fi

          if [ -f "$ISSUES" ]; then
            CRITICAL=$(python3 -c "import json; d=json.load(open('$ISSUES')); print(sum(1 for i in d if i['severity']=='critical'))")
            HIGH=$(python3     -c "import json; d=json.load(open('$ISSUES')); print(sum(1 for i in d if i['severity']=='high'))")
            MEDIUM=$(python3   -c "import json; d=json.load(open('$ISSUES')); print(sum(1 for i in d if i['severity']=='medium'))")
            echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
            echo "high=$HIGH"         >> $GITHUB_OUTPUT
            echo "medium=$MEDIUM"     >> $GITHUB_OUTPUT
          else
            echo "critical=0" >> $GITHUB_OUTPUT
            echo "high=0"     >> $GITHUB_OUTPUT
            echo "medium=0"   >> $GITHUB_OUTPUT
          fi

      # ── 8. Post commit status (shows as ✓ / ✗ on the commit in GitHub) ──────
      - name: Post commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const critical = parseInt('${{ steps.read_summary.outputs.critical }}' || '0');
            const high     = parseInt('${{ steps.read_summary.outputs.high }}'     || '0');
            const state    = (critical > 0 || high > 0) ? 'failure' : 'success';
            const desc     = (critical > 0 || high > 0)
              ? `${critical} critical, ${high} high severity issues found`
              : 'All test agents passed';

            await github.rest.repos.createCommitStatus({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              sha:         context.sha,
              state:       state,
              description: desc,
              context:     'BazaarLens Test Agents',
              target_url:  `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      # ── 9. Post a comment on the commit with the full summary ─────────────────
      - name: Comment on commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const critical = parseInt('${{ steps.read_summary.outputs.critical }}' || '0');
            const high     = parseInt('${{ steps.read_summary.outputs.high }}'     || '0');
            const medium   = parseInt('${{ steps.read_summary.outputs.medium }}'   || '0');
            const summary  = `${{ steps.read_summary.outputs.summary }}`;

            const badge = critical > 0 ? '🔴 CRITICAL ISSUES'
                        : high > 0     ? '🟠 HIGH ISSUES'
                        : medium > 0   ? '🟡 MEDIUM ISSUES'
                        :                '✅ ALL CLEAR';

            const body = [
              `## BazaarLens Test Agents — ${badge}`,
              '',
              `> Triggered by deployment to **${{ github.event.deployment.environment || 'production' }}**`,
              '',
              '| Agent | Severity | Count |',
              '|---|---|---|',
              `| All agents | 🔴 Critical | ${critical} |`,
              `| All agents | 🟠 High     | ${high} |`,
              `| All agents | 🟡 Medium   | ${medium} |`,
              '',
              '### Summary',
              summary || '_No summary available._',
              '',
              `[View full report →](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            ].join('\n');

            await github.rest.repos.createCommitComment({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              commit_sha: context.sha,
              body:       body
            });

      # ── 10. Upload report + issues JSON as downloadable artifact ─────────────
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazaarlens-test-report-${{ github.run_number }}
          path: |
            bazaarlens-tests/reports/report_*.md
            bazaarlens-tests/reports/issues_*.json
          retention-days: 30

      # ── 11. Fail the job if critical or high issues were found ────────────────
      - name: Fail on critical/high issues
        if: steps.run_tests.outputs.exit_code == '1'
        run: |
          echo "::error::Test agents found critical or high severity issues."
          echo "Download the report artifact for details."
          exit 1
